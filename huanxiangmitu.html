        :root {

        @keyframes breathe { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(232, 198, 104, 0.3)); } 50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(232, 198, 104, 0.6)); } }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
        @keyframes explode-flash { 0%, 100% { opacity: 0; transform: scale(3); } 50% { opacity: 1; transform: scale(1); } }
        @keyframes card-flip { from { transform: rotateY(90deg) scale(0.9); opacity: 0; } to { transform: rotateY(0deg) scale(1); opacity: 1; } }
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

        @keyframes zoom-in-modal { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes convert-to-fragments { 0% { transform: scale(1) rotate(0deg); filter: brightness(1); } 40% { transform: scale(1.1) rotate(5deg); filter: brightness(1.5) drop-shadow(0 0 15px white); } 100% { transform: scale(0) rotate(10deg); filter: brightness(2); } }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 10px rgba(232, 198, 104, 0.5); } 50% { box-shadow: 0 0 25px rgba(232, 198, 104, 0.8); } }
        @keyframes float-up { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }
        
        .converting { animation: convert-to-fragments 0.6s ease-in-out forwards; }

    <script>
        // 统一资源管理器
        class ResourceManager {
            static SHARED_KEY = 'shared_resources';
            
            static getResource(resourceName) {
                const resources = JSON.parse(localStorage.getItem(this.SHARED_KEY)) || {};
                return resources[resourceName] || 0;
            }
            
            static setResource(resourceName, amount) {
                const resources = JSON.parse(localStorage.getItem(this.SHARED_KEY)) || {};
                resources[resourceName] = amount;
                localStorage.setItem(this.SHARED_KEY, JSON.stringify(resources));
            }
            
            static deductResource(resourceName, amount) {
                const current = this.getResource(resourceName);
                if (current < amount) return false;
                this.setResource(resourceName, current - amount);
                return true;
            }
            
            static addResource(resourceName, amount) {
                this.setResource(resourceName, this.getResource(resourceName) + amount);
            }
        }
        
        // 夜莺祝福管理器（使用统一资源存储）
        class NightingaleManager {
            static updateUI() {
                const amount = ResourceManager.getResource('nightingale');
                const el = document.getElementById('currency-nightingale');
                if (el) el.innerText = amount;
            }
        }
        
        // 火漆管理器（使用统一资源存储）
        class HuoqiManager {
            static updateUI() {
                const huoqiAmount = ResourceManager.getResource('huoqi');
                const clueAmount = ResourceManager.getResource('clue');
                const fragmentsAmount = ResourceManager.getResource('fragments');
                const elHuoqi = document.getElementById('currency-huoqi');
                const elClue = document.getElementById('currency-clue');
                const elFragments = document.getElementById('currency-fragments');
                if (elHuoqi) elHuoqi.innerText = huoqiAmount;
                if (elClue) elClue.innerText = clueAmount;
                if (elFragments) elFragments.innerText = fragmentsAmount;
            }
        }

        class HXMTApp {
            constructor() {
                this.config = null;
                this.state = null;
                this.isAnimating = false;
                this.currentResults = [];
                this.probabilities = null;
                this.isProbabilityMode = false;
                this.globalOwnedItems = this.loadGlobalOwnedItems();
                this.listData = null;
            }
            
            getItemKey(item) {
                return `${item.name}|${item.type}|${item.rarity}|${item.img || ''}`;
            }
            
            loadGlobalOwnedItems() {
                const globalStorageKey = 'global_owned_items_hxmt';
                const saved = localStorage.getItem(globalStorageKey);
                return saved ? JSON.parse(saved) : {};
            }
            
            saveGlobalOwnedItems() {
                const globalStorageKey = 'global_owned_items_hxmt';
                localStorage.setItem(globalStorageKey, JSON.stringify(this.globalOwnedItems));
            }
            
            async init() {
                try {
                    const basePath = '/HXMT';
                    const cacheBuster = `?t=${new Date().getTime()}`;
                    
                    const poolResponse = await fetch(`${basePath}/pool.json${cacheBuster}`);
                    if (!poolResponse.ok) throw new Error(`无法加载 ${basePath}/pool.json (状态: ${poolResponse.status})`);
                    this.config = await poolResponse.json();
                    this.loadState();
                    
                    const probResponse = await fetch(`${basePath}/possibility.json${cacheBuster}`);
                    if (!probResponse.ok) throw new Error(`无法加载 ${basePath}/possibility.json`);
                    this.probabilities = await probResponse.json();

                } catch (error) {
                    console.error("加载配置文件时出错:", error);
                    alert(`错误: ${error.message}！请检查文件是否存在且格式正确。`);
                    this.isAnimating = true;
                }
                this.initUI();
            }
            
            loadState() {
                const poolId = this.config?.id || 'HXMT';
                const storageKey = `data_${poolId}`;
                const defaultState = {
                    total: 0,
                    history: [],
                    currencies: { nightingale: this.config?.initialCurrencies?.nightingale || 1000 },
                    ownedItems: {},
                    seniorCount: 0,
                    rareItemCount: 0,
                    lastMilestone: 0
                };
                const savedState = localStorage.getItem(storageKey);
                if (savedState) {
                    this.state = { ...defaultState, ...JSON.parse(savedState) };
                } else {
                    this.state = defaultState;
                    this.saveData();
                }
            }
            
            saveData() {
                const poolId = this.config?.id || 'HXMT';
                const storageKey = `data_${poolId}`;
                localStorage.setItem(storageKey, JSON.stringify(this.state));
                this.updateUI();
            }
            
            clearData() {
                const poolId = this.config?.id || 'HXMT';
                const storageKey = `data_${poolId}`;
                if (confirm("确定要清空吗？抽卡记录将重置，但夜莺祝福和已拥有的物品不会被重置。")) {
                    localStorage.removeItem(storageKey);
                    this.loadState();
                    document.getElementById('history-modal').classList.add('hidden');
                    document.getElementById('pool-preview-modal').classList.add('hidden');
                }
            }
            
            initUI() {
                if (!this.config) return;
                document.title = this.config.name;
                document.getElementById('pool-name').innerText = this.config.name;
                document.getElementById('pool-desc').innerText = "每次抽取消耗100火漆，获得20夜莺祝福";
                document.getElementById('essence-img').src = this.config.essenceImage;
                this.updateUI();
            }
            
            updateUI() {
                if (!this.config || !this.state) return;
                
                const nightingaleAmount = ResourceManager.getResource('nightingale');
                document.getElementById('currency-nightingale').innerText = nightingaleAmount;
                document.getElementById('total-pulls').innerText = this.state.total;
                document.getElementById('senior-count').innerText = this.state.seniorCount;
                document.getElementById('rare-count').innerText = this.state.rareItemCount;
                
                if (this.isProbabilityMode) {
                    this.updateProbabilityDisplay();
                } else {
                    document.getElementById('pity-panel').classList.remove('hidden');
                    document.getElementById('probability-panel').classList.add('hidden');
                }
            }
            
            updateProbabilityDisplay() {
                const p = this.probabilities.probabilities;
                document.getElementById('prob-senior').innerText = `${(p.senior * 100).toFixed(1)}%`;
                document.getElementById('prob-intermediate').innerText = `${(p.intermediate * 100).toFixed(1)}%`;
                document.getElementById('prob-junior').innerText = `${(p.junior * 100).toFixed(1)}%`;
                document.getElementById('prob-basic').innerText = `${(p.basic * 100).toFixed(1)}%`;
                document.getElementById('prob-discount').innerText = `${(p.discount * 100).toFixed(1)}%`;
                
                document.getElementById('pity-panel').classList.add('hidden');
                document.getElementById('probability-panel').classList.remove('hidden');
            }
            
            toggleProbabilityMode() {
                this.isProbabilityMode = !this.isProbabilityMode;
                const button = document.getElementById('probability-toggle');
                if (this.isProbabilityMode) {
                    button.classList.add('active');
                } else {
                    button.classList.remove('active');
                }
                this.updateUI();
            }
            
            determineRarity() {
                const p = this.probabilities.probabilities;
                const rand = Math.random();
                let cumulative = 0;
                
                if (rand < (cumulative += p.senior)) return 'senior';
                if (rand < (cumulative += p.intermediate)) return 'intermediate';
                if (rand < (cumulative += p.junior)) return 'junior';
                if (rand < (cumulative += p.basic)) return 'basic';
                return 'discount';
            }
            
            selectItem(rarity) {
                const pool = this.config.items[rarity] || [];
                if (pool.length === 0) {
                    return { name: `未知${rarity}奖励`, type: '奖励', rarity: rarity };
                }
                return pool[Math.floor(Math.random() * pool.length)];
            }
            
            async pull(count) {
                if (this.isAnimating) return;
                
                const costPerPull = 100;
                const totalCost = count * costPerPull;
                const currentHuoqi = ResourceManager.getResource('huoqi');
                
                if (currentHuoqi < totalCost) {
                    alert(`火漆不足！需要 ${totalCost} 火漆，当前拥有 ${currentHuoqi} 火漆`);
                    return;
                }
                
                this.isAnimating = true;
                
                // 扣除火漆
                ResourceManager.deductResource('huoqi', totalCost);
                HuoqiManager.updateUI(); // 更新火漆显示
                
                document.getElementById('btn-pull-1').disabled = true;
                document.getElementById('btn-pull-10').disabled = true;
                
                const orb = document.getElementById('essence-orb');
                orb.classList.remove('breathing');
                orb.classList.add('shaking');
                
                this.currentResults = [];
                let maxTier = 'discount';
                const tierValue = { discount: 0, basic: 1, junior: 2, intermediate: 3, senior: 4 };
                
                const pullReward = this.config.pullReward || 20;
                const milestoneRewards = this.config.milestoneRewards || [];
                
                for (let i = 0; i < count; i++) {
                    this.state.total++;
                    
                    const rarity = this.determineRarity();
                    const itemTemplate = this.selectItem(rarity);
                    
                    let finalItem = { 
                        ...itemTemplate, 
                        rarity: rarity,
                        pullIndex: this.state.total
                    };
                    
                    if (tierValue[rarity] > tierValue[maxTier]) {
                        maxTier = rarity;
                    }
                    
                    const itemKey = this.getItemKey(finalItem);
                    if (this.globalOwnedItems[itemKey]) {
                        finalItem.isRepeat = true;
                        const repeatReward = this.config.repeatRewards[rarity] || 0;
                        finalItem.repeatBonus = repeatReward;
                    } else {
                        this.globalOwnedItems[itemKey] = true;
                        this.saveGlobalOwnedItems();
                        finalItem.isRepeat = false;
                        finalItem.repeatBonus = 0;
                    }
                    
                    if (rarity === 'senior') {
                        this.state.seniorCount++;
                        this.state.rareItemCount++;
                    } else if (rarity === 'intermediate') {
                        this.state.rareItemCount++;
                    }
                    
                    // 如果抽到线索或碎片，直接加入资源
                    if (itemTemplate.type === '线索') {
                        const match = itemTemplate.name.match(/(\d+)/);
                        if (match) {
                            ResourceManager.addResource('clue', parseInt(match[1]));
                        }
                    } else if (itemTemplate.type === '碎片') {
                        const match = itemTemplate.name.match(/(\d+)/);
                        if (match) {
                            ResourceManager.addResource('fragments', parseInt(match[1]));
                        }
                    }
                    
                    this.state.history.unshift({
                        rarity: rarity,
                        name: itemTemplate.name,
                        idx: this.state.total,
                        time: new Date().toLocaleTimeString(),
                        isRepeat: finalItem.isRepeat
                    });
                    
                    this.currentResults.push(finalItem);
                }
                
                const totalPullReward = count * pullReward;
                ResourceManager.addResource('nightingale', totalPullReward);
                
                let milestoneBonus = 0;
                for (const milestone of milestoneRewards) {
                    if (this.state.total >= milestone.pulls && this.state.lastMilestone < milestone.pulls) {
                        milestoneBonus += milestone.reward;
                    }
                }
                this.state.lastMilestone = milestoneRewards
                    .filter(m => this.state.total >= m.pulls)
                    .reduce((max, m) => Math.max(max, m.pulls), this.state.lastMilestone);
                
                if (milestoneBonus > 0) {
                    ResourceManager.addResource('nightingale', milestoneBonus);
                }
                
                this.saveData();
                
                await new Promise(r => setTimeout(r, 800));
                const flash = document.getElementById('flash-layer');
                const flashColor = {
                    senior: '#e8c668',
                    intermediate: '#689de8',
                    junior: '#10b981',
                    basic: '#6b7280',
                    discount: '#f59e0b'
                }[maxTier] || '#f59e0b';
                
                flash.style.background = `radial-gradient(circle, #fff 10%, ${flashColor} 90%)`;
                flash.style.animation = 'explode-flash 0.5s forwards';
                
                await new Promise(r => setTimeout(r, 250));
                document.getElementById('main-screen').classList.add('hidden');
                flash.style.opacity = 0;
                
                this.showResultScreen(this.currentResults, totalPullReward, milestoneBonus);
                
                await new Promise(r => setTimeout(r, 500));
                orb.classList.remove('shaking');
                orb.classList.add('breathing');
                flash.style.animation = '';
                this.isAnimating = false;
                document.getElementById('btn-pull-1').disabled = false;
                document.getElementById('btn-pull-10').disabled = false;
            }
            
            async showResultScreen(items, pullReward, milestoneBonus) {
                const container = document.getElementById('cards-container');
                const screen = document.getElementById('result-screen');
                const header = document.getElementById('result-header');
                const footer = document.getElementById('result-footer');
                
                screen.classList.remove('hidden');
                screen.classList.add('flex');
                container.innerHTML = '';
                footer.innerHTML = '';
                header.style.opacity = '0';
                footer.style.opacity = '0';
                
                const cardGrid = document.createElement('div');
                if (items.length === 1) {
                    cardGrid.className = 'w-full flex justify-center items-center py-4';
                } else {
                    cardGrid.className = 'grid grid-cols-3 sm:grid-cols-5 gap-2 w-full max-w-6xl p-2';
                }
                container.appendChild(cardGrid);
                
                const rarityNames = {
                    discount: '随机折扣',
                    basic: '基础奖励',
                    junior: '初级奖励',
                    intermediate: '中级奖励',
                    senior: '高级奖励'
                };
                
                let totalRepeatBonus = 0;
                
                items.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.id = `result-card-${index}`;
                    const sizeClass = items.length === 1 ? 'w-5/6 max-w-[200px] aspect-[2/3]' : 'w-full aspect-[2/3]';
                    const imgContent = item.img ? 
                        `<img src="${item.img}" class="absolute inset-0 w-full h-full object-contain opacity-80 group-hover:opacity-100 transition-opacity" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+PHJlY3Qgd2lkdGg9IjEwMCIgaGVpZHN0PSIxMDAiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCIgeT0iNTAiIGZvbnQtZmFtaWx5PSJzZXJpZiIgZm9udC1zaXplPSI0MCIgZmlsbD0iIzU1NSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+PzwvdGV4dD48L3N2Zz4='">` : 
                        `<div class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900"><i class="fa-solid fa-gift text-4xl mb-2 text-rarity-${item.rarity}"></i></div>`;
                    
                    card.setAttribute('onclick', `app.showItemDetail(${index})`);
                    card.className = `card ${sizeClass} rarity-${item.rarity} bg-gray-900 rounded-lg flex flex-col relative group cursor-pointer shadow-2xl border-2 border-gray-700 ${item.isRepeat ? 'is-repeat' : ''}`;
                    card.style.animation = `card-flip 0.4s ease-out forwards ${index * 0.15 + 0.5}s`;
                    card.style.opacity = '0';
                    
                    const repeatBadge = item.isRepeat ? 
                        `<div class="absolute top-2 left-2 bg-red-500 text-white text-xs px-2 py-1 rounded-full z-20 font-bold">重复 +${item.repeatBonus || 0}</div>` : '';
                    
                    card.innerHTML = `
                        ${repeatBadge}
                        <div class="absolute inset-0 bg-black/20 z-10"></div>
                        <div class="absolute top-0 right-0 p-2 z-20">
                            <span class="font-bold font-gothic text-lg sm:text-xl italic text-rarity-${item.rarity} drop-shadow-md">${rarityNames[item.rarity] || item.rarity}</span>
                        </div>
                        <div class="card-image-container flex-1 relative overflow-hidden bg-gray-900 flex items-center justify-center">
                            ${imgContent}
                        </div>
                        <div class="card-name-container relative z-20 p-2 text-center border-t border-white/10">
                            <div class="text-xs sm:text-sm font-bold text-gray-200 tracking-wide truncate">${item.name}</div>
                            <div class="text-xs text-gray-500">${item.type || '奖励'}</div>
                        </div>
                    `;
                    cardGrid.appendChild(card);
                    
                    if (item.isRepeat) {
                        totalRepeatBonus += (item.repeatBonus || 0);
                    }
                });
                
                const pullCount = items.length;
                const totalNightingale = pullReward + milestoneBonus + totalRepeatBonus;
                
                footer.innerHTML = `
                    <div class="text-center mb-4 p-3 bg-yellow-900/30 border border-yellow-600 rounded-lg">
                        <p class="text-yellow-400 font-bold">本次获得夜莺祝福</p>
                        <p class="text-2xl text-white">+${totalNightingale}</p>
                        <p class="text-xs text-gray-400">
                            ${pullReward} (抽取) + ${milestoneBonus} (里程碑) + ${totalRepeatBonus} (重复)
                        </p>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="app.closeResult()" class="idv-btn w-40 py-3">确 认</button>
                        <button onclick="app.pull(${pullCount}, true)" class="idv-btn w-40 py-3 text-amber-100 border-amber-700">再次 x${pullCount}</button>
                    </div>
                `;
                
                await new Promise(r => setTimeout(r, 200));
                header.style.transition = 'opacity 1s';
                header.style.opacity = '1';
                
                const allCardsAnimationTime = items.length * 150 + 500;
                await new Promise(r => setTimeout(r, allCardsAnimationTime));
                footer.style.transition = 'opacity 0.5s';
                footer.style.opacity = '1';
            }
            
            closeResult(showMain = true) {
                const screen = document.getElementById('result-screen');
                screen.classList.add('hidden');
                screen.classList.remove('flex');
                if (showMain) {
                    document.getElementById('main-screen').classList.remove('hidden');
                }
            }
            
            _displayDetailModal(item) {
                if (!item) return;
                document.getElementById('detail-name').textContent = item.name || '未知物品';
                document.getElementById('detail-type').textContent = item.type || '未知类型';
                document.getElementById('detail-desc').textContent = item.description || '暂无描述。';
                document.getElementById('detail-img').src = item.img || '';
                
                const glow = document.getElementById('detail-rarity-glow');
                const rarityColors = {
                    senior: 'gold',
                    intermediate: 'royalblue',
                    junior: 'green',
                    basic: 'gray',
                    discount: 'orange'
                };
                glow.style.background = rarityColors[item.rarity] || 'transparent';
                
                const repeatBonusInfo = document.getElementById('repeat-bonus-info');
                if (item.isRepeat) {
                    repeatBonusInfo.classList.remove('hidden');
                    document.getElementById('repeat-bonus-amount').textContent = item.repeatBonus || 0;
                } else {
                    repeatBonusInfo.classList.add('hidden');
                }
                
                const modal = document.getElementById('item-detail-modal');
                modal.classList.remove('hidden');
                modal.classList.add('flex', 'show');
            }
            
            showItemDetail(index) {
                this._displayDetailModal(this.currentResults[index]);
            }
            
            closeItemDetail() {
                const modal = document.getElementById('item-detail-modal');
                modal.classList.add('hidden');
                modal.classList.remove('flex', 'show');
            }
            
            toggleHistory() {
                const el = document.getElementById('history-modal');
                el.classList.toggle('hidden');
                if (!el.classList.contains('hidden')) {
                    this.renderHistory();
                }
            }
            
            renderHistory() {
                const list = document.getElementById('history-list');
                const rarityNames = {
                    senior: '高级',
                    intermediate: '中级',
                    junior: '初级',
                    basic: '基础',
                    discount: '折扣'
                };
                
                list.innerHTML = this.state.history.map(h => {
                    const textColorClass = `text-rarity-${h.rarity}`;
                    const repeatBadge = h.isRepeat ? '<span class="text-red-400 text-xs">(重复)</span>' : '';
                    return `<div class="flex justify-between p-2 border-b border-gray-700/50 ${textColorClass}">
                        <span>[${rarityNames[h.rarity]}] ${h.name} ${repeatBadge}</span>
                        <span class="text-xs text-gray-500">第${h.idx}抽</span>
                    </div>`;
                }).join('') || '<div class="text-center text-gray-500 mt-4">暂无记录</div>';
            }
            
            togglePoolPreview() {
                const el = document.getElementById('pool-preview-modal');
                el.classList.toggle('hidden');
                if (!el.classList.contains('hidden')) {
                    this.renderPoolPreview();
                }
            }
            
            renderPoolPreview() {
                const listContainer = document.getElementById('pool-preview-list');
                if (!this.config) {
                    listContainer.innerHTML = '<p class="text-center text-gray-500">加载数据失败...</p>';
                    return;
                }
                
                const rarities = [
                    { key: 'senior', name: '高级奖励' },
                    { key: 'intermediate', name: '中级奖励' },
                    { key: 'junior', name: '初级奖励' },
                    { key: 'basic', name: '基础奖励' },
                    { key: 'discount', name: '随机折扣' }
                ];
                
                const placeholderImg = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+PHJlY3Qgd2lkdGg9IjEwMCIgaGVpZHN0PSIxMDAiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCIgeT0iNTAiIGZvbnQtZmFtaWx5PSJzZXJpZiIgZm9udC1zaXplPSI0MCIgZmlsbD0iIzU1NSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+PzwvdGV4dD48L3N2Zz4=';
                
                let htmlContent = '';
                
                rarities.forEach(rarity => {
                    const items = this.config.items[rarity.key] || [];
                    if (items.length > 0) {
                        htmlContent += `<div class="mb-8">
                            <h4 class="text-rarity-${rarity.key} font-gothic text-xl mb-4 border-b-2 border-rarity-${rarity.key}/30 pb-2">${rarity.name}</h4>
                            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3">`;
                        
                        items.forEach((item, index) => {
                            const itemKey = this.getItemKey(item);
                            const isOwned = this.globalOwnedItems[itemKey];
                            const ownedClass = isOwned ? 'owned' : 'not-owned';
                            const itemImg = item.img || placeholderImg;
                            
                            htmlContent += `<div class="pool-item ${ownedClass}" title="${item.name}\n${item.type}" onclick="app.showPoolItemDetail('${rarity.key}', ${index})">
                                <div class="img-container">
                                    <img src="${itemImg}" alt="${item.name}" loading="lazy" onerror="this.src='${placeholderImg}'">
                                </div>
                                <p class="text-gray-300 truncate"><span class="inline-block">${item.name}</span></p>
                            </div>`;
                        });
                        
                        htmlContent += `</div></div>`;
                    }
                });
                
                listContainer.innerHTML = htmlContent || '<p class="text-center text-gray-500">奖池为空</p>';
                
                setTimeout(() => {
                    const itemPs = listContainer.querySelectorAll('.pool-item p');
                    itemPs.forEach(p => {
                        const span = p.querySelector('span');
                        p.classList.remove('truncate');
                        
                        if (span && span.scrollWidth > (p.clientWidth + 1)) {
                            const originalText = span.textContent;
                            p.innerHTML = `<div class="marquee-wrapper" style="white-space: nowrap;"><span>${originalText}&nbsp;&nbsp;&nbsp;${originalText}</span></div>`;
                            
                            const wrapper = p.querySelector('.marquee-wrapper');
                            const innerSpan = wrapper.querySelector('span');
                            const scrollSpeed = 30;
                            const totalWidth = innerSpan.scrollWidth / 2;
                            const duration = totalWidth / scrollSpeed;
                            
                            wrapper.style.setProperty('--marquee-duration', `${duration}s`);
                        } else {
                            p.classList.add('truncate');
                        }
                    });
                }, 50);
            }
            
            showPoolItemDetail(rarity, index) {
                const item = this.config.items[rarity][index];
                if (item) {
                    this._displayDetailModal(item);
                }
            }
        }
        
        let app;
        document.addEventListener('DOMContentLoaded', async () => {
            app = new HXMTApp();
            NightingaleManager.updateUI(); // 更新夜莺祝福显示
            HuoqiManager.updateUI(); // 更新火漆显示
            await app.init();
            
            const MIN_WIDTH = 200;
            const MIN_HEIGHT = 450;
            const smallScreenAlertShown = sessionStorage.getItem('smallScreenAlertShownHXMT');
            
            if ((window.innerWidth < MIN_WIDTH || window.innerHeight < MIN_HEIGHT) && !smallScreenAlertShown) {
                alert(`您的屏幕尺寸（${window.innerWidth}x${window.innerHeight}）过小，可能会导致显示问题。`);
                sessionStorage.setItem('smallScreenAlertShownHXMT', 'true');
            }
        });
    </script>
</body>
</html>
